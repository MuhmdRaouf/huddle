[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/MuhmdRaouf/huddle"
publish = false

[workspace.dependencies]
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal", "fs", "process"] }
hyper = { version = "=1.12.0", default-features = false, features = ["client", "server", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["client", "client-legacy", "http1", "server", "tokio"] }
http-body-util = { version = "=0.1.5", default-features = false }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = { version = "=0.8.5", default-features = false }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
ring = { version = "=0.17.14", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "preserve_order"] }
libc = { version = "=0.2.191", default-features = false, features = ["std"] }

huddle-testkit = { path = "crates/huddle-testkit" }
huddle-config = { path = "crates/huddle-config" }
huddle-catalog = { path = "crates/huddle-catalog" }

[profile.release]
lto = "fat"
panic = "abort"
strip = true
codegen-units = 1
