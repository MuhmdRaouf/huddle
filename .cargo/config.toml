# The bundled SQLite is built without the features huddle does not use: the history crate runs plain
# SQL (tables, indexes, WAL, strftime). Local, docker and CI builds all read this file.
[env]
LIBSQLITE3_FLAGS = """\
-USQLITE_ENABLE_FTS3 \
-USQLITE_ENABLE_FTS3_PARENTHESIS \
-USQLITE_ENABLE_FTS5 \
-USQLITE_ENABLE_RTREE \
-USQLITE_ENABLE_STAT4 \
-USQLITE_ENABLE_DBSTAT_VTAB \
-USQLITE_ENABLE_COLUMN_METADATA \
-USQLITE_ENABLE_LOAD_EXTENSION \
-USQLITE_SOUNDEX \
-DSQLITE_OMIT_LOAD_EXTENSION \
-DSQLITE_OMIT_JSON \
-DSQLITE_OMIT_DEPRECATED \
-DSQLITE_OMIT_SHARED_CACHE \
-DSQLITE_OMIT_PROGRESS_CALLBACK \
-DSQLITE_OMIT_AUTHORIZATION \
-DSQLITE_OMIT_TRACE \
-DSQLITE_OMIT_COMPLETE \
-DSQLITE_OMIT_GET_TABLE \
-DSQLITE_OMIT_TCL_VARIABLE\
"""
