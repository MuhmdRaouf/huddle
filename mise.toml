# =============================================================================
# mise.toml — pins every tool this repository uses to an exact version.
#
#   Why: builds are reproducible and CI and a laptop must agree, so the
#   toolchain is pinned here and CI reads the same versions.
#
#   Rules:
#     - Exact versions only, never ranges. Bump one row, run `mise run check`,
#       commit.
#
#   Start:    mise run setup    (tools + the git hook, once per clone)
#             mise tasks        (every task below)
# =============================================================================

[tools]
# mr_boxington wraps cargo with mbx: one shared build cache across every worktree.
rust         = { version = "1.100.0", components = ["clippy", "rustfmt"], mr_boxington = true }
mr-boxington = "1.30.0"
python       = "3.15.2"
pre-commit   = "4.7.0"
gitleaks     = "8.30.1"
# bun runs the dev tooling. The tools themselves (esbuild, which minifies the dashboard page) are
# the devDependencies of package.json, pinned exactly in bun.lock and installed by `mise run setup`.
# Without them a plain cargo build embeds the page unminified.
bun          = "1.4.4"

# =============================================================================

[tasks.setup]
description = "Install the pinned tools and the pre-commit hook (once per clone)"
dir = "{{config_root}}"
run = [
  "mise install",
  "bun install --frozen-lockfile",
  "pre-commit install --install-hooks",
]

[tasks.lint]
description = "Run every pre-commit hook on every file"
dir = "{{config_root}}"
run = "pre-commit run --all-files"

[tasks.check]
description = "Every gate CI runs: lint, static checks and the test suites"
dir = "{{config_root}}"
depends = ["lint", "pins:check", "rust:check"]
run = [
  "mise run rust:check",
]

[tasks."rust:check"]
description = "Rust gates: format, lint and the test suites (unit, then e2e)"
dir = "{{config_root}}"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  "mise run test:unit",
  "mise run test:e2e",
]

# The unit suite: every crate's lib and bin tests, plus every integration test target outside
# package huddle that release/e2e-tests does not claim for the e2e suite.
[tasks."test:unit"]
description = "The unit suite only: lib and bin tests of every crate plus the integration targets the e2e suite does not own"
dir = "{{config_root}}"
run = '''
# A `--test <name>` flag selects that target in every package the selection covers, so
# `--workspace` never shares a command with the per-target flags: the lib and bin tests run
# on their own, then the unit integration targets run with only their packages selected.
# eval: keep the argument list splitting under whatever shell mise picks for task scripts
eval "cargo run -q -p huddle-testkit --bin huddle-test-guard -- --workspace --lib --bins --locked --no-fail-fast -- --test-threads=8" || exit $?
args=""
for tests_dir in crates/*/tests; do
  [ -d "$tests_dir" ] || continue
  pkg=${tests_dir#crates/}
  pkg=${pkg%/tests}
  [ "$pkg" = huddle ] && continue
  for test_file in "$tests_dir"/*.rs; do
    [ -f "$test_file" ] || continue
    target=$(basename "$test_file" .rs)
    grep -Fxq "$pkg $target" release/e2e-tests && continue
    args="$args -p $pkg --test $target"
  done
done
# eval: keep the argument list splitting under whatever shell mise picks for task scripts
eval "cargo run -q -p huddle-testkit --bin huddle-test-guard -- $args --locked --no-fail-fast -- --test-threads=8" || exit $?
'''

# The e2e suite: every integration test target of package huddle starts the real binary, plus
# the targets release/e2e-tests claims for it.
[tasks."test:e2e"]
description = "The e2e suite only: every integration test target of package huddle plus the targets release/e2e-tests names"
dir = "{{config_root}}"
run = '''
args="-p huddle"
for test_file in crates/huddle/tests/*.rs; do
  [ -f "$test_file" ] || continue
  args="$args --test $(basename "$test_file" .rs)"
done
while read -r pkg target; do
  case $pkg in ''|\#*) continue ;; esac
  args="$args -p $pkg --test $target"
done < release/e2e-tests
# eval: keep the argument list splitting under whatever shell mise picks for task scripts
eval "cargo run -q -p huddle-testkit --bin huddle-test-guard -- $args --locked --no-fail-fast -- --test-threads=8" || exit $?
'''

[tasks."dashboard:check"]
description = "Parse the joined dashboard script and fail on a syntax error or a duplicate top-level name (DASHBOARD_PAGE=<file> checks another page)"
dir = "{{config_root}}"
run = [
  "cargo build -q -p huddle-router",
  '''bun -e '
const fs = require("fs");
const path = require("path");
const explicit = process.env.DASHBOARD_PAGE;
const pages = () => {
  const found = [];
  for (const profile of fs.readdirSync("target")) {
    const builds = path.join("target", profile, "build");
    if (!fs.existsSync(builds)) continue;
    for (const dir of fs.readdirSync(builds))
      if (dir.startsWith("huddle-router-")) {
        const page = path.join(builds, dir, "out", "page.html");
        if (fs.existsSync(page)) found.push([fs.statSync(page).mtimeMs, page]);
      }
  }
  return found.sort((a, b) => b[0] - a[0]).map((x) => x[1]);
};
const file = explicit || pages()[0];
if (!file) { console.error("no page.html found: run cargo build -p huddle-router"); process.exit(1); }
const html = fs.readFileSync(file, "utf8");
const open = html.indexOf("<script>\n") + "<script>\n".length;
const script = html.slice(open, html.lastIndexOf("</script>"));
const out = path.join("target", `dashboard-check-${process.pid}.js`);
fs.writeFileSync(out, script);
const built = Bun.spawnSync(["bun", "build", "--no-bundle", out], { stdout: "ignore", stderr: "pipe" });
fs.unlinkSync(out);
if (built.exitCode !== 0) { console.error(`syntax error in ${file}:\n${built.stderr}`); process.exit(1); }
const seen = new Map();
for (const line of script.split("\n")) {
  const m = /^(?:async\s+)?function\s*\*?\s*([\w$]+)|^(?:const|let|var|class)\s+([\w$]+)/.exec(line);
  if (m) seen.set(m[1] || m[2], (seen.get(m[1] || m[2]) || 0) + 1);
}
const dup = [...seen].filter(([, n]) => n > 1).map(([name]) => name);
if (dup.length) { console.error(`duplicate top-level name in ${file}: ${dup.join(", ")}`); process.exit(1); }
console.log(`dashboard script ok: ${file}`);
'
''',
]

[tasks."pins:check"]
description = "Fail when a tool pin is a range, a branch or latest, or when a workflow, the Dockerfile or a hook names another version than mise.toml and package.json (PINS_ROOT=<dir> checks another tree)"
dir = "{{config_root}}"
run = "bun scripts/pins-check.js"

[tasks."check:history"]
description = "Scan every commit of the current branch for secrets and AI attribution (as CI does)"
dir = "{{config_root}}"
run = [
  "gitleaks git --config .gitleaks.toml --redact --verbose --log-opts=HEAD .",
  "cargo run -q -p huddle-testkit --bin huddle-check-attribution",
]

# =============================================================================
# docker — the same gates and builds inside the toolchain image
# (Dockerfile + docker-compose.yml). The image never COPYs the checkout:
# compose bind-mounts it. Run builds one at a time.
# =============================================================================

[tasks."docker:check"]
description = "The rust:check gates inside the docker toolchain image"
dir = "{{config_root}}"
run = "docker compose run --rm huddle sh -c \"cargo fmt --all --check && cargo clippy --workspace --all-targets --locked -- -D warnings && cargo run -q -p huddle-testkit --bin huddle-test-guard -- --workspace --locked -- --test-threads=8\""

[tasks."docker:build"]
description = "Both static Linux binaries, size-checked, inside the docker toolchain image"
dir = "{{config_root}}"
run = "docker compose run --rm huddle sh -c \"cargo zigbuild --release --locked -p huddle --bin huddle --target x86_64-unknown-linux-musl && cargo zigbuild --release --locked -p huddle --bin huddle --target aarch64-unknown-linux-musl && cargo run -q --locked -p huddle-release -- size target/docker/x86_64-unknown-linux-musl/release/huddle target/docker/aarch64-unknown-linux-musl/release/huddle\""

[tasks."docker:lint"]
description = "The pre-commit hooks on every file, inside the docker toolchain image"
dir = "{{config_root}}"
run = "docker compose run --rm huddle sh -c \"pre-commit run --all-files\""

[tasks."docker:shell"]
description = "A shell in the docker toolchain image with the checkout mounted"
dir = "{{config_root}}"
run = "docker compose run --rm huddle bash"
