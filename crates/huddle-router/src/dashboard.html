<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Huddle Admin</title>
<style>
/* Layout: admin shell. Sticky sidebar (brand, host, search, grouped nav with live badges, router card, theme) + sticky top bar
   + content pages built from one table component. Detail lives in a right-hand sheet; ⌘K opens a command palette.
   Colours: the Admin Dashboard palette (Catppuccin-based, high contrast). */
:root{
  --page:#eff1f5;--surface:#ffffff;--subtle:#e6e9ef;--line:#ccd0da;--line-soft:#dce0e8;
  --text:#2b2c3e;--muted:#5c5f77;--faint:#7c7f93;
  --accent:#1e66f5;--ok:#2a7a19;--warn:#975a00;--bad:#b4082f;--mauve:#8839ef;--teal:#147d78;--peach:#c24e2e;
  --warn-bg:#fdf3dc;--bad-bg:#fbe4e9;--ok-bg:#e3f2de;--accent-bg:#e2eafd;
  --l1:#1e9c96;--l2:#0c2b33;--l3:#c24e2e;--l4:#c24e2e;--ring:#0c2b33;
  --c1:#1e66f5;--c2:#147d78;--c3:#8839ef;--c4:#c24e2e;--c5:#a86a12;--c6:#c8418f;
  --shadow:0 1px 2px rgba(17,17,27,.06);--pop:0 16px 48px rgba(17,17,27,.18),0 2px 6px rgba(17,17,27,.08);
  --scrim:rgba(17,17,27,.28);--sbw:256px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#11111b;--surface:#181825;--subtle:#1e1e2e;--line:#313244;--line-soft:#262637;
  --text:#e4e8fb;--muted:#bac2de;--faint:#8b90a8;
  --accent:#89b4fa;--ok:#a6e3a1;--warn:#f9e2af;--bad:#f38ba8;--mauve:#cba6f7;--teal:#94e2d5;--peach:#fab387;
  --warn-bg:#2e2a22;--bad-bg:#2f1f29;--ok-bg:#1f2a23;--accent-bg:#1f2840;
  --l1:#2fb8b0;--l2:#17857f;--l3:#ff8a6b;--l4:#e8623f;--ring:#cfe8ea;
  --c1:#89b4fa;--c2:#94e2d5;--c3:#cba6f7;--c4:#fab387;--c5:#f9e2af;--c6:#f5c2e7;
  --shadow:none;--pop:0 16px 48px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.04);--scrim:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#11111b;--surface:#181825;--subtle:#1e1e2e;--line:#313244;--line-soft:#262637;
  --text:#e4e8fb;--muted:#bac2de;--faint:#8b90a8;
  --accent:#89b4fa;--ok:#a6e3a1;--warn:#f9e2af;--bad:#f38ba8;--mauve:#cba6f7;--teal:#94e2d5;--peach:#fab387;
  --warn-bg:#2e2a22;--bad-bg:#2f1f29;--ok-bg:#1f2a23;--accent-bg:#1f2840;
  --l1:#2fb8b0;--l2:#17857f;--l3:#ff8a6b;--l4:#e8623f;--ring:#cfe8ea;
  --c1:#89b4fa;--c2:#94e2d5;--c3:#cba6f7;--c4:#fab387;--c5:#f9e2af;--c6:#f5c2e7;
  --shadow:none;--pop:0 16px 48px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.04);--scrim:rgba(0,0,0,.5);color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--page)}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.okc{color:var(--ok)}.warnc{color:var(--warn)}.badc{color:var(--bad)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
kbd{font-family:var(--mono);font-size:10.5px;padding:0 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;color:var(--muted);background:var(--surface);line-height:16px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--sbw) minmax(0,1fr);min-height:100dvh}
.sb{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:14px;background:var(--surface);border-right:1px solid var(--line);padding:16px 12px 12px;overflow-y:auto;z-index:35;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:11px;padding:2px 6px}
.brand svg{width:38px;height:38px;flex:none}
.word{font-size:20px;font-weight:600;letter-spacing:-.025em;line-height:1}
.word b{font-weight:inherit;background:linear-gradient(135deg,var(--l1),var(--l3));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:12px;color:var(--muted);white-space:nowrap}
.chip{font-family:var(--mono);font-size:11px;padding:0 6px;border:1px solid var(--line);border-radius:999px;color:var(--muted);line-height:18px;white-space:nowrap}
.host{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--page);text-align:left;width:100%}
.host .t{font-size:13px;font-weight:500;line-height:1.25}
.host .s{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.sbsearch{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;color:var(--faint);font-size:13px;width:100%;background:var(--surface)}
.sbsearch:hover{border-color:var(--faint);color:var(--muted)}
.sbsearch kbd{margin-left:auto}
.nav{display:flex;flex-direction:column;gap:14px}
.gl{font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;padding:0 10px 5px}
.nav a{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:8px;color:var(--muted);font-size:13.5px;font-weight:500;margin-bottom:1px}
.nav a:hover{background:var(--subtle);color:var(--text)}
.nav a[aria-current="page"]{background:var(--subtle);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.nav a[aria-current="page"] svg{color:var(--accent)}
.badge{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;line-height:18px}
.badge.warn,.badge.bad,.badge.acc{padding:0 7px;border-radius:999px;font-weight:600}
.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.acc{background:var(--accent-bg);color:var(--accent)}
.sbfoot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line-soft)}
.rcard{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--page);font-size:12px}
.rcard .r1{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.rcard .r1 .chip{margin-left:auto}
.rcard .r2{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rcard .r2 div{display:flex;flex-direction:column}
.rcard .r2 span{color:var(--faint);font-size:11px}
.rcard .r2 b{font-family:var(--mono);font-weight:500;font-size:12px;font-variant-numeric:tabular-nums}
.tseg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--page)}
.tseg button{display:flex;align-items:center;justify-content:center;gap:6px;padding:5px 0;border-radius:7px;color:var(--faint);font-size:12px}
.tseg button:hover{color:var(--text)}
.tseg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow),inset 0 0 0 1px var(--line)}
.tseg svg.i{width:14px;height:14px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;min-height:52px;background:color-mix(in srgb,var(--page) 84%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line-soft);padding-left:max(clamp(16px,3vw,32px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,3vw,32px),env(safe-area-inset-right,0px))}
.menu{display:none;width:32px;height:32px;border:1px solid var(--line);border-radius:8px;place-items:center;color:var(--muted);background:var(--surface)}
.tbbrand{display:none;align-items:center;gap:8px;font-weight:600}
.tbbrand svg{width:24px;height:24px}
.crumbs{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);min-width:0;white-space:nowrap}
.crumbs b{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.crumbs svg.i{width:14px;height:14px;color:var(--faint)}
.tbright{margin-left:auto;display:flex;align-items:center;gap:14px}
.livep{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.livep b{color:var(--text);font-weight:500}
.tbk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--faint);border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--surface)}

.content{width:100%;max-width:1480px;padding-block:24px 56px;padding-left:max(clamp(16px,3vw,32px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,3vw,32px),env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
.reg{display:contents}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ph h1{font-size:24px;font-weight:600;letter-spacing:-.025em;margin:0;line-height:1.15;text-wrap:balance}
.ph p{margin:6px 0 0;color:var(--muted);font-size:13.5px;max-width:72ch}
.ph .act{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sh{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sh h2{font-size:14.5px;font-weight:600;margin:0;letter-spacing:-.01em}
.sh .note{font-size:12.5px;color:var(--muted)}
.sh .more{margin-left:auto;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:2px}
.sh .more:hover{color:var(--text)}
.sh .more svg.i{width:14px;height:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.card.t{overflow:hidden}
.pad{padding:16px 18px}
.g2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px}
.g2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.foot{font-size:12.5px;color:var(--faint);display:flex;gap:8px;align-items:center;justify-content:center;padding-top:8px}

/* ---------- atoms ---------- */
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none;display:inline-block}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.dot.acc{background:var(--accent)}.dot.off{background:var(--line)}
.dot.pulse{animation:p 1.8s infinite}
.dot.ok.pulse{color:color-mix(in srgb,var(--ok) 55%,transparent)}
.dot.warn.pulse{color:color-mix(in srgb,var(--warn) 55%,transparent)}
.dot.acc.pulse{color:color-mix(in srgb,var(--accent) 55%,transparent)}
@keyframes p{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:0 8px 0 6px;border-radius:999px;white-space:nowrap;line-height:21px}
.pill svg.i{width:13px;height:13px;stroke-width:2.4}
.pill .dot{margin:0 1px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.acc{background:var(--accent-bg);color:var(--accent)}.pill.off{background:var(--subtle);color:var(--muted)}
.pill.na{color:var(--faint);padding-left:0;background:none}
.tag{font-size:12px;font-weight:500;padding:2px 8px;border-radius:6px;white-space:nowrap}
.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.acc{background:var(--accent-bg);color:var(--accent)}.tag.off{background:var(--subtle);color:var(--muted)}
.sw{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}
.mt{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.meter{height:6px;border-radius:3px;background:var(--subtle);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line-soft)}
.meter i{display:block;height:100%;border-radius:3px;background:var(--text)}
.meter i.hi{background:var(--warn)}.meter i.max{background:var(--bad)}.meter i.acc{background:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px;font-weight:500;white-space:nowrap;color:var(--text)}
.btn:hover{background:var(--subtle)}
.btn.sm{height:26px;padding:0 10px;font-size:12.5px}
.btn svg.i{width:14px;height:14px}
.cmd{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;padding:2px 8px;border:1px dashed var(--line);border-radius:6px;color:var(--text);white-space:nowrap;background:var(--surface)}
.cmd:hover{border-style:solid;border-color:var(--faint)}
.cmd svg.i{width:13px;height:13px;color:var(--faint)}
.cid{font-family:var(--mono);font-size:12px;color:inherit;border-bottom:1px dotted var(--faint)}
.cid:hover{color:var(--accent);border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{padding:5px 12px;font-size:13px;color:var(--muted);border-left:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.seg button:first-child{border-left:0}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--subtle);color:var(--text);font-weight:500}
.seg button .n{color:var(--faint);margin-left:5px;font-family:var(--mono);font-size:11.5px}
.search{min-width:200px;width:260px;max-width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);padding:5px 10px 5px 30px;font:13px var(--sans);background-image:none;height:30px}
.search::placeholder{color:var(--faint)}
.sbox{position:relative;display:inline-flex}
.sbox svg.i{position:absolute;left:9px;top:8px;width:14px;height:14px;color:var(--faint)}
.delta{font-size:12px;font-weight:500;margin-left:8px;letter-spacing:0}
.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}.delta.flat{color:var(--faint)}
.dots{display:inline-flex;gap:3px;margin-left:7px;vertical-align:middle}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.running{background:var(--accent)}.dots i.done{background:var(--ok)}.dots i.waiting{background:var(--warn)}

/* ---------- KPI grid ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line-soft);overflow:hidden}
.kpis.k6{grid-template-columns:repeat(6,minmax(0,1fr))}
.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpi{background:var(--surface);padding:14px 16px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .k{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.kpi .v{font-size:24px;font-weight:600;letter-spacing:-.025em;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v small{font-size:12.5px;font-weight:400;color:var(--muted);margin-left:3px;letter-spacing:0}
.kpi .d{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .meter{margin-top:6px}
.sp{display:block;width:100%;height:28px;margin-top:4px}

/* ---------- tables ---------- */
.tbl{overflow-x:auto;scrollbar-width:thin}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:9px 12px;background:var(--subtle);border-bottom:1px solid var(--line);white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text)}
.caret{margin-left:4px;color:var(--accent);font-size:11px}
td{padding:10px 12px;border-top:1px solid var(--line-soft);vertical-align:middle;white-space:nowrap}
tbody tr:first-child td{border-top:0}
tbody tr.clickable{cursor:pointer}
tbody tr:hover td{background:color-mix(in srgb,var(--subtle) 55%,transparent)}
tbody tr.sel td{background:var(--accent-bg)}
tbody tr.dim td{color:var(--faint)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
td.wrap{white-space:normal;min-width:220px}
td.empty{text-align:center;color:var(--faint);padding:28px 14px}
.ct{font-weight:500;max-width:340px;overflow:hidden;text-overflow:ellipsis}
.cs{font-size:12px;color:var(--muted);font-family:var(--mono);margin-top:1px;max-width:380px;overflow:hidden;text-overflow:ellipsis}
.err-small{font-size:12px;color:var(--bad);font-family:var(--mono);margin-top:1px}
.fill{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.fill .meter{width:64px}
.sharebar{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.sharebar .meter{width:80px}
.tsp{width:96px;height:22px;display:block;margin-left:auto}
.access{display:inline-flex;gap:4px}
.access span{font-family:var(--mono);font-size:11px;padding:0 6px;border-radius:5px;background:var(--subtle);color:var(--muted);line-height:18px}

/* ---------- overview parts ---------- */
.attn-row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line-soft)}
.attn-row:first-child{border-top:0}
.attn-row .what{flex:1;min-width:0}
.attn-row .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attn-row .m{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attn-row .tag{min-width:96px;text-align:center}
.allclear{padding:14px 16px;display:flex;gap:10px;align-items:center;color:var(--muted)}
.chart{overflow:hidden}
.mtabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line)}
.mtab{padding:14px 18px;text-align:left;border-left:1px solid var(--line-soft);position:relative;min-width:0}
.mtab:first-child{border-left:0}
.mtab .k{font-size:12.5px;color:var(--muted)}
.mtab .v{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.mtab .v small{font-size:12.5px;font-weight:400;color:var(--muted);margin-left:2px}
.mtab[aria-selected="true"]{background:var(--subtle)}
.mtab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent)}
.mtab:hover:not([aria-selected="true"]){background:color-mix(in srgb,var(--subtle) 50%,transparent)}
.chart-body{display:grid;grid-template-columns:minmax(0,1fr) 300px}
.plot{position:relative;padding:18px 8px 6px 0;min-width:0}
.plot svg{display:block;width:100%;height:240px;overflow:visible;touch-action:none}
.plot .gl{stroke:var(--line-soft)}
.plot .ax{fill:var(--faint);font:11px var(--mono)}
.tip{position:absolute;top:14px;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12.5px;box-shadow:var(--pop);min-width:190px;opacity:0;transition:opacity .1s;z-index:2}
.tip.on{opacity:1}
.tip .h{color:var(--muted);font-size:11.5px;margin-bottom:5px;font-family:var(--mono)}

function plugRows(){return PL.rows.map(r=>{const L=LANES.find(l=>l.id===r.name),last=L?laneLast(L):null,gone=r.installed===false;
 const stat=(s,t)=>s===200?['ok',`200 · ${ago(t)}`]:s===429?['warn',`429 · ${ago(t)}`]:['bad',`${s} · ${ago(t)}`];
 const work=typeof r.working==='boolean'?(r.working?['ok','Working']:['off','No requests yet']):!L?['na','—']:!last?['off','No requests yet']:stat(last.status,last.t);
 const nm=num(r.models);
 return {n:r.name||'',d:L?L.match:'',v:r.version||null,
  inst:r.installed===true?['ok','Installed']:gone?['off','Not installed']:['na','—'],
  setup:gone?['na','—']:r.setup===true?['ok','Done']:r.setup===false?['bad','Not run']:['na','—'],

  model:nm?['ok',nm+' model'+(nm===1?'':'s')]:gone?['na','—']:['off','None'],
  work:gone?['na','—']:work,req:num(r.requests)!=null?r.requests:L?L.n:0,next:r.next||null}})}

let DR=null;
const closeBtn=()=>`<button class="x" data-close aria-label="Close">${ic('x')}</button>`;
const DRAWERS={
 session(id){const s=SESS.find(x=>x.id===id);if(!s)return '';const rs=sReq(s),cl=cacheLeft(s),c=s.ctx==null?null:Math.round(s.ctx);const t0=NOW-15*MIN;
  const lane=a=>aReq(a).filter(r=>r.t>=t0);
  const unmatched=rs.filter(r=>!r.a&&r.t>=t0);
  const bar=r=>{const x=Math.max(0,(r.t-t0)/(15*MIN)*100),w=Math.max(.5,(r.dur!=null?r.dur:NOW-r.t)/(15*MIN)*100);return `<i class="${r.status==null?'flight':''}" style="left:${x.toFixed(2)}%;width:${Math.min(w,100-x).toFixed(2)}%;background:${isErr(r)?'var(--bad)':r.status===499?'var(--faint)':col(r.m)}" title="${esc(r.m)} · ${r.status==null?'streaming':r.status}"></i>`};
  return `<div class="dh"><div class="grow">${statePill(s)}<h3>${esc(s.name)}</h3><div class="s">${esc([s.project,s.branch].filter(Boolean).join(' · '))} · ${cid(s.sid)}</div></div>${closeBtn()}</div>
  <div class="db">
   <div class="gauges"><div class="gauge"><div class="top"><span>Context window</span><b>${c==null?'—':c+'%'}</b></div>${meter(c,c>=90?'max':c>=80?'hi':'')}<div class="n">${c!=null&&c>=80?'<span class="warnc">Compaction soon.</span> ':''}${s.ctxTok!=null&&s.ctxLim?fmt(s.ctxTok)+' of '+fmt(s.ctxLim)+' tokens':'—'}</div></div>
   <div class="gauge"><div class="top"><span>Prompt cache</span><b>${cl==null?'—':cl>0?dur(cl):'Cold'}</b></div>${meter(cl>0&&s.ttl?cl/s.ttl*100:0,cl!=null&&cl<60e3?'hi':'acc')}<div class="n">${s.ttl==null?'—':s.ttl>=HR?'1-hour':'5-minute'} cache · last hit ${ago(s.lastReq)}</div></div></div>
   <div><h4>Details</h4><div class="facts">
    <div class="fact"><div class="k">Session id</div><div class="v">${cid(s.id)}</div></div>
    <div class="fact"><div class="k">Path</div><div class="v">${cid(tilde(s.cwd))}</div></div>
    <div class="fact"><div class="k">Branch</div><div class="v mono">${esc(s.branch||'—')}</div></div>
    <div class="fact"><div class="k">Main model</div><div class="v">${modelTag(mainA(s).model)}</div></div>
    <div class="fact"><div class="k">Started</div><div class="v">${s.started==null?'—':clock(s.started).slice(0,5)+' · '+ago(s.started)}</div></div>
    <div class="fact"><div class="k">Last activity</div><div class="v">${ago(lastT(s))}</div></div>
    <div class="fact"><div class="k">Requests</div><div class="v">${rs.length} · ${rs.filter(isErr).length} errors</div></div>
    <div class="fact"><div class="k">Tokens in</div><div class="v">${fmt(tokInOf(rs))}</div></div>
    <div class="fact"><div class="k">Cache read</div><div class="v">${fmt(sum(rs.map(r=>n0(r.cr))))}</div></div>
    <div class="fact"><div class="k">Tokens out</div><div class="v">${fmt(tokOutOf(rs))}</div></div></div></div>
   <div><h4>Agents <span class="faint">${s.agents.length}</span></h4><div class="card t">${table('d-ag',AG_COLS.filter(c=>['agent','model','state','dur','req','wt'].includes(c.k)),s.agents,{})}</div></div>
   <div><h4>Timeline <span class="faint">each bar is one request · last 15 min</span></h4><div class="swim">${s.agents.map(a=>`<div class="row"><div class="who">${a.type==='main'?'<b style="font-weight:500">main</b>':esc(a.desc||a.type)}</div><div class="track">${lane(a).map(bar).join('')}</div></div>`).join('')}${unmatched.length?`<div class="row"><div class="who faint">not matched to an agent</div><div class="track">${unmatched.map(bar).join('')}</div></div>`:''}</div><div class="axis"><span>${clock(t0).slice(0,5)}</span><span>${clock(t0+5*MIN).slice(0,5)}</span><span>${clock(t0+10*MIN).slice(0,5)}</span><span>now</span></div></div>
   <div><h4>Recent requests</h4><div class="card t">${table('d-req',REQ_COLS.filter(c=>['time','status','model','ttft','in','out'].includes(c.k)),rs.slice().reverse(),{row:r=>'request:'+r.id,limit:12,empty:'No requests kept for this session'})}</div></div>
   <div class="notebox">${ic('info')}<span>Read from Claude Code's session log for ${esc(s.sid)}. Prompt text and tool output are never read into this page.</span></div>
  </div>`},
 request(id){const r=REQS.find(x=>x.id===id);if(!r)return '';
  const total=r.dur!=null?r.dur:r.status==null?NOW-r.t:null,L=LANES.find(l=>l.id===r.lane);
  let wf='';
  if(total>0){const rt=n0(r.rt),tt=r.ttft!=null?r.ttft:r.status==null?Math.min(total,NOW-r.t):0;const s1=Math.min(100,rt/total*100),s2=Math.max(0,Math.min(100-s1,(tt-rt)/total*100)),s3=Math.max(0,100-s1-s2);
   wf=`<div><h4>Timing <span class="faint">${(total/1e3).toFixed(2)} s total</span></h4><div class="wf"><i style="width:${s1.toFixed(2)}%;background:var(--faint)"></i><i style="width:${s2.toFixed(2)}%;background:var(--warn)"></i><i style="width:${s3.toFixed(2)}%;background:${col(r.m)}"></i></div>
    <div class="wfl"><span><span class="sw" style="background:var(--faint)"></span>Router <b>${r.rt==null?'—':r.rt<1?'&lt;1 ms':r.rt+' ms'}</b></span><span><span class="sw" style="background:var(--warn)"></span>First token <b>${msf(r.ttft)}</b></span><span><span class="sw" style="background:${col(r.m)}"></span>Streaming <b>${r.ttft!=null?((total-r.ttft)/1e3).toFixed(1)+' s':'—'}</b></span></div></div>`}
  return `<div class="dh"><div class="grow">${reqStatus(r)}<h3>${modelTag(r.m)} <span class="muted" style="font-weight:400;font-size:15px">· ${clock(r.t)}</span></h3><div class="s">${cid(r.id.slice(1))}</div></div>${closeBtn()}</div>
  <div class="db">${wf}
   <div><h4>Tokens</h4><div class="facts">
    <div class="fact"><div class="k">Fresh input</div><div class="v">${fmt(r.in)}</div></div><div class="fact"><div class="k">Cache write</div><div class="v">${fmt(r.cw)}</div></div>
    <div class="fact"><div class="k">Cache read</div><div class="v">${fmt(r.cr)}</div></div><div class="fact"><div class="k">Output</div><div class="v">${r.status==null?'streaming…':fmt(r.out)}</div></div>
    <div class="fact"><div class="k">Output speed</div><div class="v">${speed(r)?Math.round(speed(r))+' tok/s':'—'}</div></div><div class="fact"><div class="k">Stop reason</div><div class="v mono">${esc(r.stop||'—')}</div></div></div></div>
   <div><h4>Route</h4><dl class="kv"><dt>Session</dt><dd>${r.s?`<button class="cid" data-open="session:${esc(r.s.id)}">${esc(r.s.name)}</button> <span class="mono faint">${esc(r.s.sid)}</span>`:'—'}</dd><dt>Agent</dt><dd>${r.a?(r.a.type==='main'?'main':`<span class="mono">${esc(r.a.type)}</span> · ${esc(r.a.desc)}`):'—'}</dd>
    <dt>Lane</dt><dd>${L?`${esc(L.name)} <span class="mono faint">${esc(L.match)} → ${esc(L.id)}</span>`:esc(r.lane||'—')}</dd><dt>Upstream id</dt><dd>${cid(r.up)}</dd>
    ${r.status&&r.status!==200?`<dt>Cause</dt><dd>${esc(errDef(r.status,r.reason)[2])}</dd>`:''}</dl></div>
   <div class="notebox">${ic('info')}<span>The router keeps the model, timings, token counts and status. It never keeps the prompt, the answer or header values.</span></div>
  </div>`},
 project(name){const p=projects().find(x=>x.name===name);if(!p)return '';
  return `<div class="dh"><div class="grow"><span class="pill off">${ic('projects')}Project</span><h3>${esc(p.name)}</h3><div class="s">${cid(tilde(p.path))}</div></div>${closeBtn()}</div>
  <div class="db">
   <div class="facts"><div class="fact"><div class="k">Live sessions</div><div class="v">${p.live} of ${p.sessions.length}</div></div><div class="fact"><div class="k">Agents running</div><div class="v">${p.agentsRun}</div></div><div class="fact"><div class="k">Requests</div><div class="v">${p.reqs.length}</div></div><div class="fact"><div class="k">Tokens in / out</div><div class="v">${fmt(p.tin)} / ${fmt(p.tout)}</div></div></div>
   <div><h4>Sessions</h4><div class="card t">${table('d-ps',SESS_COLS.filter(c=>['state','title','model','ctx','last'].includes(c.k)),p.sessions,{row:s=>'session:'+s.id,empty:'No sessions'})}</div></div>
   <div><h4>Worktrees <span class="faint">${p.wts.length}</span></h4><div class="card list">${p.wts.map(w=>`<div class="li">${kindPill(w.kind)}<div class="grow"><div class="mono">${esc(w.branch||'(detached)')}</div><div class="sm mono">${esc(tilde(w.path))}</div></div>${changesCell(w)}</div>`).join('')||`<div class="allclear">${ic('info')} No worktrees</div>`}</div></div>
   ${p.jobs.length?`<div><h4>Jobs</h4><div class="card list">${p.jobs.map(j=>`<div class="li"><div class="grow"><div><span class="mono">${esc(j.id)}</span> <span class="muted">· ${esc(j.h)}</span></div><div class="sm">${esc(j.task)}</div></div>${jobPill(j)}</div>`).join('')}</div></div>`:''}
  </div>`}
};
function openDrawer(key){const[k,id]=key.split(/:(.*)/s);if(!DRAWERS[k])return;DR={k,id,key};renderDrawer(false);$('#drawer').classList.add('on');$('#scrim').classList.add('on');refresh()}
function closeDrawer(){DR=null;$('#drawer').classList.remove('on');if(!$('#sb').classList.contains('on'))$('#scrim').classList.remove('on');refresh()}
function renderDrawer(keep){if(!DR)return;const body=$('#drawer .db'),top=keep&&body?body.scrollTop:0;setHtml($('#drawer'),DRAWERS[DR.k](DR.id));const nb=$('#drawer .db');if(nb)nb.scrollTop=top}

/* ---------- shell: nav, crumbs, router card ---------- */
const NAV=[
 ['Monitor',[['overview','Overview'],['sessions','Sessions'],['agents','Agents'],['requests','Requests'],['errors','Errors']]],
 ['Usage',[['models','Models'],['providers','Providers'],['usage','Usage']]],
 ['Workspace',[['projects','Projects'],['worktrees','Worktrees'],['jobs','Jobs']]],
 ['System',[['plugins','Plugins'],['harnesses','Harnesses'],['router','Router']]]
];
function badge(k){switch(k){
 case 'sessions':{const w=SESS.filter(s=>sstate(s)==='waiting').length;return w?`<span class="badge warn" title="waiting on you">${w}</span>`:`<span class="badge">${SESS.filter(s=>sstate(s)!=='idle').length}</span>`}
 case 'agents':return `<span class="badge acc">${AGENTS.filter(a=>a.type!=='main'&&a.state==='running').length}</span>`;
 case 'requests':return `<span class="badge">${Math.round(sum(BK.slice(20).map(b=>b.n))/5)}/m</span>`;
 case 'errors':{const e=stats().done.filter(isErr).length;return e?`<span class="badge bad">${e}</span>`:''}
 case 'models':return `<span class="badge">${MODELS.length}</span>`;
 case 'providers':return `<span class="badge">${LANES.filter(l=>l.state==='live').length}</span>`;
 case 'projects':return `<span class="badge">${projects().length}</span>`;
 case 'worktrees':return `<span class="badge">${WT.length}</span>`;
 case 'jobs':return `<span class="badge">${JOBS.filter(j=>j.state==='running'||j.state==='awaiting_review').length}</span>`;
 case 'plugins':{const n=PL.rows.filter(r=>r.next).length;return n?`<span class="badge warn">${n}</span>`:''}
 case 'harnesses':return HARN.length?`<span class="badge">${HARN.filter(h=>h.st==='ready').length}</span>`:'';
 default:return ''}}
function navHtml(){return NAV.map(([g,items])=>`<div><div class="gl">${g}</div>${items.map(([k,l])=>`<a href="#${k}"${k===page?' aria-current="page"':''}>${ic(k)}${l}${badge(k)}</a>`).join('')}</div>`).join('')}
const dashHost=()=>arr(SNAP.hosts)[0]||location.host||'huddle router';
const dashUrl=()=>arr(SNAP.hosts)[0]||location.host;
function rcard(){return `<div class="r1">${dot(LOST?'bad':'ok',!LOST)}Router ${LOST?'down':'up'}${location.port?`<span class="chip">:${esc(location.port)}</span>`:''}</div><div class="r2"><div><span>Uptime</span><b>${upCell().replace(/ \d+s$/,'')}</b></div><div><span>CPU</span><b>${cpuCell()}</b></div><div><span>Memory</span><b>${mb(RT.rss)}</b></div></div>`}
function shell(){setHtml($('#nav'),navHtml());setHtml($('#rcard'),rcard());$('#clock').textContent=clock(NOW);
 $('#vchip').textContent=SNAP.version?'v'+SNAP.version:'';
 const hb=$('#hostbtn');hb.dataset.copy=dashUrl();setHtml(hb,`${dot(LOST?'bad':'ok',!LOST)}<span><span class="t" style="display:block">${esc(dashHost())}</span><span class="s">${location.host?'→ '+esc(location.host):'router'}</span></span>`);
 $('#livew').textContent=LOST?'Reconnecting':'Live';
 const lp=$('#livedot');lp.className='dot '+(LOST?'bad':'ok pulse')}

/* ---------- routing ---------- */
let page='overview';
function render(){REG={};const h=(location.hash||'#overview').slice(1);page=PAGES[h]?h:'overview';const p=PAGES[page];
 const grp=NAV.find(([,its])=>its.some(([k])=>k===page))[0];
 setHtml($('#crumbs'),`<span class="c0">Huddle</span>${ic('chev')}<span>${grp}</span>${ic('chev')}<b>${p.title}</b>`);
 setHtml($('#content'),p.body()+`<div class="foot">${dot('ok',true)} Memory only. Restarting the router clears this page.</div>`);
 if(p.after)p.after();shell();closeSidebar();window.scrollTo(0,0)}
window.addEventListener('hashchange',render);

/* ---------- interactions ---------- */
function toast(t){const el=$('#toast');setHtml(el,ic('check')+esc(t));el.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.remove('on'),1400)}
function copy(t){const done=()=>toast('Copied '+(t.length>36?t.slice(0,34)+'…':t));try{navigator.clipboard.writeText(t).then(done,()=>toast('Select and copy: '+t))}catch(e){toast('Select and copy: '+t)}}
document.addEventListener('click',e=>{
 const c=e.target.closest('[data-copy]');if(c){e.stopPropagation();copy(c.dataset.copy);return}
 if(e.target.closest('[data-close]')){closeDrawer();return}
 const so=e.target.closest('[data-sort]');if(so){const[id,k]=so.dataset.sort.split(':');const cur=SORT[id];SORT[id]={k,d:cur&&cur.k===k?-cur.d:(so.classList.contains('num')?-1:1)};refresh();if(DR)renderDrawer(true);return}
 const sg=e.target.closest('[data-seg]');if(sg){const[id,k]=sg.dataset.seg.split(':');if(id==='range'){setRange(k);return}F[id]=k;$$('[data-seg]').filter(b=>b.dataset.seg.startsWith(id+':')).forEach(b=>b.setAttribute('aria-pressed',String(b===sg)));refresh();return}
 const mt=e.target.closest('[data-metric]');if(mt){CH.metric=mt.dataset.metric;refresh();drawChart();return}
 const fo=e.target.closest('[data-focus]');if(fo){CH.focus=CH.focus===fo.dataset.focus?null:fo.dataset.focus;refresh();drawChart();return}
 const op=e.target.closest('[data-open]');if(op){openDrawer(op.dataset.open);return}
 const th=e.target.closest('[data-theme-set]');if(th){setTheme(th.dataset.themeSet);return}
});
document.addEventListener('input',e=>{const q=e.target.closest('[data-q]');if(q){F.q[q.dataset.q]=q.value;refresh()}});
$('#scrim').onclick=()=>{closeDrawer();closeSidebar()};
$('#menu').onclick=()=>{$('#sb').classList.add('on');$('#scrim').classList.add('on')};
function closeSidebar(){$('#sb').classList.remove('on');if(!DR)$('#scrim').classList.remove('on')}
function setTheme(t){if(t==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);$$('[data-theme-set]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.themeSet===t)));try{localStorage.setItem('huddle-admin-theme',t)}catch(e){}}

/* command palette */
const PAL={i:0,items:[]};
function palItems(q){const L=[];NAV.forEach(([g,its])=>its.forEach(([k,l])=>L.push({g:'Pages',l,ic:k,ty:g,go:()=>{location.hash=k}})));
 SESS.forEach(s=>L.push({g:'Sessions',l:s.name,ic:'sessions',ty:s.project+' · '+s.sid,go:()=>{if(page!=='sessions')location.hash='sessions';openDrawer('session:'+s.id)}}));
 projects().forEach(p=>L.push({g:'Projects',l:p.name,ic:'projects',ty:tilde(p.path),go:()=>{if(page!=='projects')location.hash='projects';openDrawer('project:'+p.name)}}));
 MODELS.forEach(m=>L.push({g:'Models',l:m.id,ic:'models',ty:m.lane,go:()=>{location.hash='models'}}));
 [['system','Theme: match the system','monitor'],['light','Theme: light','sun'],['dark','Theme: dark','moon']].forEach(([k,l,i])=>L.push({g:'Actions',l,ic:i,ty:'',go:()=>setTheme(k)}));
 L.push({g:'Actions',l:'Copy the dashboard address',ic:'copy',ty:dashHost(),go:()=>copy(dashUrl())});
 q=q.trim().toLowerCase();return q?L.filter(x=>(x.l+' '+x.ty+' '+x.g).toLowerCase().includes(q)):L}
function palRender(){const q=$('#palq').value;PAL.items=palItems(q);if(PAL.i>=PAL.items.length)PAL.i=0;let g='',h='';
 PAL.items.forEach((x,i)=>{if(x.g!==g){g=x.g;h+=`<div class="pgl">${esc(g)}</div>`}h+=`<div class="pi" role="option" data-pi="${i}" aria-selected="${i===PAL.i}">${ic(x.ic)}<span class="l">${esc(x.l)}</span><span class="ty">${esc(x.ty)}</span></div>`});
 setHtml($('#pallist'),h||'<div class="pi faint">No matches</div>');const sel=$('#pallist [aria-selected="true"]');if(sel)sel.scrollIntoView({block:'nearest'})}
function palOpen(){$('#pal').classList.add('on');$('#palq').value='';PAL.i=0;palRender();setTimeout(()=>$('#palq').focus(),0)}
function palClose(){$('#pal').classList.remove('on')}
function palGo(i){const x=PAL.items[i];palClose();if(x)x.go()}
$('#openPal').onclick=palOpen;$('#openPal2').onclick=palOpen;
$('#palq').addEventListener('input',()=>{PAL.i=0;palRender()});
$('#pallist').addEventListener('click',e=>{const p=e.target.closest('[data-pi]');if(p)palGo(+p.dataset.pi)});
$('#pallist').addEventListener('mousemove',e=>{const p=e.target.closest('[data-pi]');if(p&&+p.dataset.pi!==PAL.i){PAL.i=+p.dataset.pi;$$('#pallist [data-pi]').forEach(x=>x.setAttribute('aria-selected',String(+x.dataset.pi===PAL.i)))}});
$('#pal').addEventListener('click',e=>{if(e.target.id==='pal')palClose()});
document.addEventListener('keydown',e=>{
 const palOn=$('#pal').classList.contains('on');
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();palOn?palClose():palOpen();return}
 if(palOn){if(e.key==='Escape'){palClose();return}if(e.key==='ArrowDown'){e.preventDefault();PAL.i=Math.min(PAL.items.length-1,PAL.i+1);palRender();return}if(e.key==='ArrowUp'){e.preventDefault();PAL.i=Math.max(0,PAL.i-1);palRender();return}if(e.key==='Enter'){e.preventDefault();palGo(PAL.i);return}return}
 if(e.key==='Escape'){if(DR)closeDrawer();closeSidebar();return}
 if(e.key==='/'&&!/input|textarea/i.test(document.activeElement.tagName)){e.preventDefault();palOpen()}
});
window.addEventListener('resize',()=>{if(page==='overview')drawChart()});

/* ---------- live: a feed while it holds, polling while it does not ---------- */
function paint(){refresh();shell();if(page==='overview')drawChart();if(DR)renderDrawer(true)}
let first=true;
function update(s){build(s);if(first){first=false;render()}else paint()}
function onSnapshot(s){const n=num(s&&s.now_ms);if(n!=null)OFFSET=n-Date.now();LOST=false;update(s)}
let poll=null;
function getState(){fetch('/huddle-router/state',{cache:'no-store'}).then(r=>r.json()).then(onSnapshot,()=>{LOST=true;update(SNAP)})}
function startPoll(){if(poll===null){getState();poll=setInterval(getState,2000)}}
function stopPoll(){if(poll!==null){clearInterval(poll);poll=null}}
if(typeof EventSource==='function'){
 const es=new EventSource('/huddle-router/live');
 es.addEventListener('snapshot',ev=>{let d;try{d=JSON.parse(ev.data)}catch(e){return}stopPoll();onSnapshot(d)});
 es.onerror=()=>{LOST=true;update(SNAP);startPoll()};
}else startPoll();

let saved='system';try{saved=localStorage.getItem('huddle-admin-theme')||'system'}catch(e){}
setTheme(saved);update({});
setInterval(()=>update(SNAP),2000);
setInterval(()=>{if(document.visibilityState==='visible')loadHistory()},60000);
loadHistory();
})();
</script>
</body>
</html>
