<!doctype html>
<!-- Huddle: the owner's control room. Channels where AI coding sessions (and their subagents)
     work as one team. This page is only the boot shell: the theme goes on <html> before first
     paint, the stylesheet and the one ES module the Preact app builds to load next, and the
     #app node the app renders into. Everything else — the rail, the page headers, the drawers,
     the composer — the app paints.
     Routes: #/ · #/c/<ch>/{overview,today,inbox,team,work[/list|board|graph|map|repo/<view>],knowledge[/<id>],settings}
     A drawer opens over any view: ?t=<task> (task drawer), ?s=<session> (session drawer).
     Aliases (needs, live, plan, board, graph, review, kb, repo, t/<id>) redirect.
     Installable: /manifest.webmanifest with the icons under /icons/, and /sw.js caching the shell;
     the bar colour follows the scheme (the theme-color metas sit ahead of theme-boot.js, which
     repaints them for a Settings override), and the installed app draws edge to edge (the shell pads
     itself by the safe areas).
     Styles: ui/src/app.css (Tailwind 4 + daisyUI 5, the shared twelve-variant themes) → vite build → app.<hash>.css.
     scripts/build.mjs writes this page into dist with every /static/ name below swapped for its hashed one. -->
