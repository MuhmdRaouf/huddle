<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="huddle: your coding sessions, one team">
  <title>huddle: your coding sessions, one team</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1e2e"/>
      <stop offset="1" stop-color="#11111b"/>
    </linearGradient>
    <radialGradient id="glow" cx="24%" cy="44%" r="58%">
      <stop offset="0" stop-color="#94e2d5" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#94e2d5" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#94e2d5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a6e3a1"/>
      <stop offset="0.25" stop-color="#89b4fa"/>
      <stop offset="0.5" stop-color="#94e2d5"/>
      <stop offset="0.75" stop-color="#f5c2e7"/>
      <stop offset="1" stop-color="#fab387"/>
    </linearGradient>
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#94e2d5"/>
      <stop offset="1" stop-color="#89b4fa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- the logo mark -->
  <g transform="translate(64 64) scale(0.75)">
    <rect x="4" y="4" width="120" height="120" rx="28" fill="#181825" stroke="#45475a"/>
    <g stroke="url(#link)" stroke-width="7" stroke-linecap="round">
      <path d="M64 64 L64 34 M64 64 L94 64 M64 64 L64 94 M64 64 L34 64"/>
    </g>
    <rect x="50" y="50" width="28" height="28" rx="9" fill="#1e1e2e" stroke="#94e2d5" stroke-width="5"/>
    <circle cx="64" cy="28" r="9" fill="#a6e3a1"/>
    <circle cx="100" cy="64" r="9" fill="#fab387"/>
    <circle cx="64" cy="100" r="9" fill="#89b4fa"/>
    <circle cx="28" cy="64" r="9" fill="#f5c2e7"/>
  </g>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="176" y="96" fill="#94e2d5" font-size="15" letter-spacing="3" font-weight="600">CLAUDE CODE PLUGIN · MUHMDRAOUF</text>
    <text x="176" y="146" fill="#cdd6f4" font-size="48" font-weight="700">huddle</text>
    <text x="64" y="208" fill="#cdd6f4" font-size="21">Your coding sessions, one team.</text>
    <text x="64" y="238" fill="#bac2de" font-size="19">One local hub for Claude Code and any agent that speaks MCP.</text>
  </g>
  <rect x="64" y="262" width="560" height="4" rx="2" fill="url(#bar)"/>

  <!-- the now list -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="712" y="48" width="440" height="224" rx="14" fill="#181825" stroke="#313244"/>
    <text x="736" y="84" fill="#6c7086" font-size="14" letter-spacing="2">NOW</text>
    <circle cx="744" cy="112" r="5" fill="#fab387"/>
    <text x="762" y="117" fill="#cdd6f4" font-size="16">claude  api-client</text>
    <text x="1128" y="117" fill="#fab387" font-size="15" text-anchor="end">needs you</text>
    <circle cx="744" cy="150" r="5" fill="#a6e3a1"/>
    <text x="762" y="155" fill="#cdd6f4" font-size="16">codex   refactor</text>
    <text x="1128" y="155" fill="#a6e3a1" font-size="15" text-anchor="end">working</text>
    <circle cx="744" cy="188" r="5" fill="#89b4fa"/>
    <text x="762" y="193" fill="#cdd6f4" font-size="16">gemini  docs</text>
    <text x="1128" y="193" fill="#89b4fa" font-size="15" text-anchor="end">working</text>
    <circle cx="744" cy="226" r="5" fill="#6c7086"/>
    <text x="762" y="231" fill="#a6adc8" font-size="16">qwen    board</text>
    <text x="1128" y="231" fill="#6c7086" font-size="15" text-anchor="end">idle</text>
    <text x="736" y="258" fill="#6c7086" font-size="14">every machine, one list</text>
  </g>
</svg>
